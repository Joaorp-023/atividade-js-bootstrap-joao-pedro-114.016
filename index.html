
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Notas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar bg-primary">
        <div class="container">
            <span class="navbar-brand text-white">Painel de Notas</span>
        </div>
    </nav>

    <div class="container mt-5">
        <h1>Minhas Notas</h1>
        <p>Um painel simples para acompanhar minhas notas.</p>

        <div class="row mt-4">
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h5>Nota 1</h5>
                        <p>8.0</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h5>Nota 2</h5>
                        <p>7.0</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h5>Média</h5>
                        <p>7.5</p>
                        <span class="badge bg-success">Aprovado</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="alert alert-info mt-3">
            A média necessária para aprovação é 7.
        </div>

        <button class="btn btn-primary">Minhas notas</button>
    </div>

    <footer class="bg-light text-center p-3 mt-5">
        <p>Painel de Notas - 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
